<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Debug tools — beacon only, no UI interference. Uncomment to enable. -->
<!-- <script src="debug.js"></script> -->
<title>Calendar</title>
<style>
/* === E-ink design principles ===
 * - System fonts only (no web font loading/FOIT)
 * - Borders over fills (minimise repaint area)
 * - No animations except the clock hands (stepped, minimal)
 * - No shadows, gradients, or transparency
 * - High contrast: #000 on #f5f5f5
 * - No hover states (touch device)
 *
 * === WebKit 534.26 compatibility ===
 * - Use -webkit-transform, -webkit-animation, -webkit-transform-origin
 * - Use -webkit-box for flexbox (old spec)
 * - No CSS Grid (use tables), no custom properties (JS injects values)
 * - No viewport units (JS sets pixel sizes)
 */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f5f5f5;
  color: #000;
  font-family: sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* === Landscape rotation wrapper ===
 * Rotates the entire UI 90° clockwise.
 * Width/height are set by JS (no viewport units available).
 */
.landscape-wrap {
  position: absolute;
  top: 0;
  left: 0;
  /* width and height set by JS — see initLandscape() */
  -webkit-transform: rotate(90deg);
  -webkit-transform-origin: top left;
  overflow: hidden;
  /* margin-left set by JS */
}

/* === View system === */
.view {
  display: none;
  width: 100%;
  height: 100%;
}

.view.active {
  display: -webkit-box;
}

/* === Main calendar/clock view === */
.main-view {
  -webkit-box-orient: horizontal;
  -webkit-box-align: stretch;
  -webkit-box-pack: center;
  padding: 24px;
}

/* Left panel: clock + date */
.left-panel {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-box-align: center;
  -webkit-box-pack: center;
  width: 30%;
  padding-right: 24px;
}

/* Right panel: calendars */
.right-panel {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-box-align: center;
  -webkit-box-pack: center;
  width: 70%;
}

/* Spacing between the two calendars */
.right-panel .calendar + .calendar {
  margin-top: 20px;
}

/* === Analogue clock ===
 * Smaller clock — the calendar is the main feature.
 */
.clock {
  position: relative;
  width: 300px;
  height: 300px;
  border: 5px solid #000;
  border-radius: 50%;
}

/* Quarter-hour markers */
.clock-marker {
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform-origin: 0 0;
}

.clock-marker::after {
  content: '';
  display: block;
  position: absolute;
  background: #000;
}

/* Inner radius ~145px (half of 300 minus border) */
/* 12 o'clock */
.clock-marker.m12 { -webkit-transform: translate(-50%, -50%) rotate(0deg); }
.clock-marker.m12::after { width: 5px; height: 22px; top: -147px; left: -2.5px; }

/* 3 o'clock */
.clock-marker.m3 { -webkit-transform: translate(-50%, -50%) rotate(90deg); }
.clock-marker.m3::after { width: 5px; height: 22px; top: -147px; left: -2.5px; }

/* 6 o'clock */
.clock-marker.m6 { -webkit-transform: translate(-50%, -50%) rotate(180deg); }
.clock-marker.m6::after { width: 5px; height: 22px; top: -147px; left: -2.5px; }

/* 9 o'clock */
.clock-marker.m9 { -webkit-transform: translate(-50%, -50%) rotate(270deg); }
.clock-marker.m9::after { width: 5px; height: 22px; top: -147px; left: -2.5px; }

/* Clock hands - common */
.clock-hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  -webkit-transform-origin: bottom center;
  background: #000;
  border-radius: 3px;
}

/* Hour hand — ~60% of inner radius */
.hour-hand {
  width: 7px;
  height: 88px;
  margin-left: -3.5px;
}

/* Minute hand — ~85% of inner radius */
.minute-hand {
  width: 4px;
  height: 124px;
  margin-left: -2px;
}

/* Centre dot */
.clock-centre {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  background: #000;
  border-radius: 50%;
}

/* === Date display === */
.date-display {
  margin-top: 24px;
  text-align: center;
}

.date-day-name {
  font-size: 32px;
  letter-spacing: 0.05em;
}

.date-full {
  font-size: 42px;
  font-weight: bold;
  margin-top: 4px;
}

/* === Calendar tables === */
/* Base styles (used by next month) */
.calendar {
  width: 100%;
  max-width: 740px;
}

.calendar-header {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  padding-bottom: 6px;
  border-bottom: 4px solid #000;
  margin-bottom: 0;
}

.calendar-table {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
  font-size: 22px;
  line-height: 1;
  border-left: 2px solid #000;
  border-right: 2px solid #000;
  border-bottom: 2px solid #000;
  table-layout: fixed;
}

.calendar-table th {
  font-weight: bold;
  padding: 6px 0;
  font-size: 18px;
  border-bottom: 3px solid #000;
  border-right: 1px solid #ccc;
}

.calendar-table th:last-child {
  border-right: none;
}

.calendar-table td {
  padding: 10px 2px;
  border-bottom: 1px solid #ccc;
  border-right: 1px solid #ccc;
}

.calendar-table td:last-child {
  border-right: none;
}

.calendar-table td.today {
  font-weight: bold;
  background: #000;
  color: #fff;
}

.calendar-table td.past {
  color: #999;
}

/* Current month — large, bold, fills space */
#cal-current .calendar-header {
  font-size: 40px;
  padding-bottom: 10px;
}

#cal-current .calendar-table {
  font-size: 48px;
  font-weight: bold;
}

#cal-current .calendar-table th {
  font-size: 28px;
  padding: 10px 0;
}

#cal-current .calendar-table td {
  padding: 28px 4px;
}

/* === Secondary views === */
.secondary-view {
  -webkit-box-orient: vertical;
  -webkit-box-align: center;
  -webkit-box-pack: center;
  padding: 40px;
}

.secondary-view h2 {
  font-size: 42px;
  margin-bottom: 24px;
}

.secondary-view p {
  font-size: 28px;
}

.secondary-view .back-hint {
  position: absolute;
  bottom: 24px;
  font-size: 22px;
  color: #666;
}

/* === View indicator dots === */
.view-dots {
  position: absolute;
  bottom: 12px;
  width: 100%;
  text-align: center;
}

.view-dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 3px solid #000;
  border-radius: 50%;
  margin: 0 6px;
}

.view-dot.active {
  background: #000;
}
</style>
</head>
<body>

<div class="landscape-wrap" id="root">

  <!-- View indicator dots -->
  <div class="view-dots" id="viewDots"></div>

  <!-- Main view: clock + calendar -->
  <div class="view main-view active" id="view-0">
    <div class="left-panel">
      <div class="clock" id="clock">
        <div class="clock-marker m12"></div>
        <div class="clock-marker m3"></div>
        <div class="clock-marker m6"></div>
        <div class="clock-marker m9"></div>
        <div class="clock-hand hour-hand" id="hourHand"></div>
        <div class="clock-hand minute-hand" id="minuteHand"></div>
        <div class="clock-centre"></div>
      </div>
      <div class="date-display">
        <div class="date-day-name" id="dateDayName"></div>
        <div class="date-full" id="dateFull"></div>
      </div>
    </div>
    <div class="right-panel">
      <div class="calendar" id="cal-current"></div>
      <div class="calendar" id="cal-next"></div>
    </div>
  </div>

  <!-- Placeholder secondary view (e.g. Octopus Agile rates) -->
  <div class="view secondary-view" id="view-1">
    <h2>Octopus Agile</h2>
    <p>Rates view — coming soon.</p>
    <div class="back-hint">Tap to return, or auto-returns in 30s</div>
  </div>

</div>

<script>
/* =============================================================
 * Kindle E-ink Calendar & Clock
 *
 * Design goals:
 * - Minimal JS execution (runs every minute for clock update)
 * - Clock hands positioned via direct transform (no CSS animation)
 * - Calendar re-renders only when date changes
 * - Touch to cycle views, auto-return after 30s
 * - ES5-safe for Kindle WebKit 534.26 browser
 * ============================================================= */

(function() {
  'use strict';

  // ── Constants ──
  var RECALIBRATE_MS   = 60000;   // 1 minute in ms
  var AUTO_RETURN_MS   = 30000;   // 30 seconds
  var DAYS_SHORT       = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
  var DAYS_FULL        = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS_FULL      = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];

  // ── State ──
  var currentView      = 0;
  var totalViews       = 2;
  var autoReturnTimer  = null;
  var lastDateStr      = '';

  // ── DOM refs ──
  var hourHand   = document.getElementById('hourHand');
  var minuteHand = document.getElementById('minuteHand');
  var dateDayEl  = document.getElementById('dateDayName');
  var dateFullEl = document.getElementById('dateFull');
  var calCurrent = document.getElementById('cal-current');
  var calNext    = document.getElementById('cal-next');
  var viewDots   = document.getElementById('viewDots');
  var root       = document.getElementById('root');

  // ── Utility ──
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ── Landscape wrapper sizing ──
  // Viewport units (vh/vw) are not supported. Set dimensions in pixels
  // and update margin-left for the rotation shift.
  // On Kindle WebKit 534.26, window.innerWidth/innerHeight return 0
  // during initial script execution — we must defer or use fallbacks.
  function initLandscape() {
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var h = window.innerHeight || document.documentElement.clientHeight || 0;

    if (w === 0 || h === 0) return false;

    root.style.width = h + 'px';
    root.style.height = w + 'px';
    root.style.marginLeft = w + 'px';
    return true;
  }

  // ── Clock ──
  // Each minute = 6°, each hour = 30°, each minute adds 0.5° to hour
  function getMinuteAngle(m) { return m * 6; }
  function getHourAngle(h, m)  { return (h % 12) * 30 + m * 0.5; }

  // Set clock hand positions directly via transforms.
  // Previous approach used CSS stepped animations (steps() timing function)
  // which failed to restart on WebKit 534.26 when re-applied with the same
  // animation name, causing the clock to freeze after the first 15-min block.
  function setClock() {
    var now = new Date();
    var h   = now.getHours();
    var m   = now.getMinutes();

    hourHand.style.cssText =
      '-webkit-transform: rotate(' + getHourAngle(h, m) + 'deg);';
    minuteHand.style.cssText =
      '-webkit-transform: rotate(' + getMinuteAngle(m) + 'deg);';
  }

  // ── Calendar rendering ──
  // Uses <table> instead of CSS Grid (not available on Kindle WebKit)
  function renderCalendar(container, year, month, highlightToday) {
    // month is 0-indexed
    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    // getDay() returns 0=Sun. Convert to Mon=0
    var startDow = (firstDay.getDay() + 6) % 7;

    var today = new Date();
    var todayDate = today.getDate();
    var todayMonth = today.getMonth();
    var todayYear = today.getFullYear();

    var html = '<div class="calendar-header">' + MONTHS_FULL[month] + ' ' + year + '</div>';
    html += '<table class="calendar-table"><tr>';

    // Day labels (header row)
    for (var d = 0; d < 7; d++) {
      html += '<th>' + DAYS_SHORT[d] + '</th>';
    }
    html += '</tr><tr>';

    // Empty cells before first day
    for (var e = 0; e < startDow; e++) {
      html += '<td></td>';
    }

    // Day cells
    var col = startDow;
    for (var i = 1; i <= daysInMonth; i++) {
      var cls = '';
      if (highlightToday && i === todayDate && month === todayMonth && year === todayYear) {
        cls = ' class="today"';
      } else if (highlightToday && month === todayMonth && year === todayYear && i < todayDate) {
        cls = ' class="past"';
      }
      html += '<td' + cls + '>' + i + '</td>';
      col++;
      if (col === 7 && i < daysInMonth) {
        html += '</tr><tr>';
        col = 0;
      }
    }

    // Trailing empty cells to complete the last row
    while (col > 0 && col < 7) {
      html += '<td></td>';
      col++;
    }

    html += '</tr></table>';
    container.innerHTML = html;
  }

  function renderCalendars() {
    var now = new Date();
    var year = now.getFullYear();
    var month = now.getMonth();

    renderCalendar(calCurrent, year, month, true);

    // Next month
    var nextMonth = month + 1;
    var nextYear = year;
    if (nextMonth > 11) { nextMonth = 0; nextYear++; }
    renderCalendar(calNext, nextYear, nextMonth, false);
  }

  // ── Date display ──
  function renderDate() {
    var now = new Date();
    var dateStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

    // Only re-render if the date actually changed
    if (dateStr === lastDateStr) return;
    lastDateStr = dateStr;

    dateDayEl.textContent = DAYS_FULL[now.getDay()];
    dateFullEl.textContent = now.getDate() + ' ' + MONTHS_FULL[now.getMonth()] + ' ' + now.getFullYear();

    // Re-render calendars when the date changes
    renderCalendars();
  }

  // ── View switching ──
  function renderDots() {
    var html = '';
    for (var i = 0; i < totalViews; i++) {
      html += '<div class="view-dot' + (i === currentView ? ' active' : '') + '"></div>';
    }
    viewDots.innerHTML = html;
  }

  function switchView(index) {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) {
      if (i === index) {
        views[i].className = views[i].className.replace(' active', '') + ' active';
      } else {
        views[i].className = views[i].className.replace(' active', '');
      }
    }
    currentView = index;
    renderDots();
  }

  function nextView() {
    var next = (currentView + 1) % totalViews;
    switchView(next);
    startAutoReturn();
  }

  function startAutoReturn() {
    clearTimeout(autoReturnTimer);
    if (currentView !== 0) {
      autoReturnTimer = setTimeout(function() {
        switchView(0);
      }, AUTO_RETURN_MS);
    }
  }

  // ── Touch handling ──
  // Tap anywhere to cycle between views.
  // Also recalibrates the clock — if the Kindle was asleep and the
  // setTimeout chain didn't fire, this corrects the hands immediately.
  function onTouch(e) {
    // Prevent double-firing
    if (e.type === 'touchstart') {
      e.preventDefault();
    }
    recalibrate();
    nextView();
  }

  root.addEventListener('touchstart', onTouch, false);
  root.addEventListener('click', onTouch, false);

  // ── Recalibration ──
  // Runs every minute: repositions clock hands, checks date change
  function recalibrate() {
    setClock();
    renderDate();
  }

  // ── Align recalibration to the next whole-minute boundary ──
  // Uses a setTimeout chain instead of setInterval so that each tick
  // re-aligns to the clock — avoids drift and recovers after sleep.
  function scheduleRecalibration() {
    var now = new Date();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();

    // Time until the start of the next minute
    var msUntil = (60 - s) * 1000 - ms;
    if (msUntil <= 0) msUntil += RECALIBRATE_MS;

    setTimeout(function tick() {
      recalibrate();
      var now2 = new Date();
      var msNext = (60 - now2.getSeconds()) * 1000 - now2.getMilliseconds();
      if (msNext <= 0) msNext += RECALIBRATE_MS;
      setTimeout(tick, msNext);
    }, msUntil);
  }

  // ── Initialise ──
  function init() {
    // Try immediately — may fail on Kindle (returns 0 during parse)
    if (!initLandscape()) {
      // Defer until layout is available
      window.addEventListener('load', initLandscape, false);
    }
    renderDate();
    setClock();
    renderDots();
    scheduleRecalibration();

    // Recalibrate when the page comes back from bfcache or regains focus.
    // Catches cases where the Kindle browser suspended JS timers.
    window.addEventListener('pageshow', recalibrate, false);
    window.addEventListener('focus', recalibrate, false);
  }

  init();
})();
</script>
</body>
</html>
